
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade - Sistema de Grid (Galeria)</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    
    <style>
        body {
            padding-top: 30px;
            background-color: #f5f5f5;
        }
        
        .gallery-img {
            width: 100%;
            object-fit: cover;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            border-radius: 4px;
        }
       
        .img-main { 
            height: 640px; 
        }
        .img-row-1 { 
            height: 200px; 
        }
        .img-row-2 { 
            height: 200px; 
        }
        .img-row-3 { 
            height: 200px; 
        }

        .custom-padding > [class*='col-'] {
            padding-right: 10px;
            padding-left: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row custom-padding">

        <div class="col-sm-6 col-md-6">
            <img src= 01 class="gallery-img img-main" alt="Imagem 1">
        </div>

        <div class="col-sm-6 col-md-6">

            <div class="row custom-padding">
                <div class="col-xs-12">
                    <img src= 02 class="gallery-img img-row-1" alt="Imagem 2">
                </div>
            </div>

            <div class="row custom-padding">
                <div class="col-xs-6">
                    <img src= 03 class="gallery-img img-row-2" alt="Imagem 3">
                </div>
                <div class="col-xs-6">
                    <img src= 04 class="gallery-img img-row-2" alt="Imagem 4">
                </div>
            </div>

            <div class="row custom-padding">
                <div class="col-xs-4">
                    <img src= 05 class="gallery-img img-row-3" alt="Imagem 5">
                </div>
                <div class="col-xs-4">
                    <img src= 06 class="gallery-img img-row-3" alt="Imagem 6">
                </div>
                <div class="col-xs-4">
                    <img src= 06 class="gallery-img img-row-3" alt="Imagem 6 Repetida">
                </div>
            </div>

        </div> 

    </div> 
</div> 

</body>
</html>
