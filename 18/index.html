
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade 18 - Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-group {
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="p-4">

    <div class="container">
        
        <div class="row">
            
            <div class="col-sm-8">
                <h1>Cadastre-se</h1>
                
                <form>
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" class="form-control" id="nome" placeholder="Digite seu nome">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail</label>
                        <input type="email" class="form-control" id="email" placeholder="Digite seu e-mail">
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input type="password" class="form-control" id="senha" placeholder="Digite sua senha">
                    </div>

                    <div class="form-check checkbox">
                        <label class="form-check-label">
                            <input type="checkbox" class="form-check-input"> Aceito os termos do serviço.
                        </label>
                    </div>

                    <div class="radio mt-2 mb-3">
                        <label class="me-3">
                            <input type="radio" name="opcoes" value="PHP"> PHP
                        </label>
                        <label>
                            <input type="radio" name="opcoes" value="Java"> Java
                        </label>
                    </div>

                    <button type="submit" class="btn btn-outline-secondary">Cadastrar</button>
                </form>
            </div>
            
            <div class="col-sm-4">
                <h3>Logar</h3>
                
                <form>
                    <div class="form-group">
                        <input type="email" class="form-control" id="login-email" placeholder="Digite seu e-mail">
                    </div>
                    
                    <div class="form-group">
                        <input type="password" class="form-control" id="login-senha" placeholder="Digite sua senha">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Logar</button>
                </form>
            </div>
            
        </div>

        <div class="row mt-5">
            <div class="col-12">
                
                <table class="table table-striped table-hover table-sm">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Fabricante</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="table-success">
                            <td>Notebook 980</td>
                            <td>HP</td>
                            <td>R$ 1.800,00</td>
                        </tr>
                        <tr class="table-danger">
                            <td>MacBook Air</td>
                            <td>Apple</td>
                            <td>R$ 4.800,00</td>
                        </tr>
                        <tr class="table-warning">
                            <td>HP Pavillon</td>
                            <td>HP</td>
                            <td>R$ 2.800,00</td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>

    </div>

</body>
</html>
